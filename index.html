<head>

    <!-- Ultimate Google #1 SEO Meta Tags -->
    <meta name="description" content="استعلم الان عن نتيجة الثانوية العامة 2026 برقم الجلوس والاسم فوراً. احصل على المجموع الكلي، والنسبة المئوية، وترتيب الطالب والشهادة الموثقة مجاناً.">

    <!-- Google Structured Data JSON-LD Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "موقع نتائج الثانوية العامة 2026 الرسمي",
      "alternateName": "نتيجة الثانوية العامة 2026",

      "potentialAction": {
        "@type": "SearchAction",

      }

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- React 18 & ReactDOM 18 & Babel Standalone -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div class="glow-backdrop"></div>
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    const normalizeArabic = (text) => {
        if (!text) return '';
        return String(text)
            .replace(/[أإآٱ]/g, 'ا')
            .replace(/ة/g, 'ه')
            .replace(/ى/g, 'ي')
            .replace(/[\u064B-\u0652]/g, '')
            .trim()
            .toLowerCase();
    };

    function App() {
        const [theme, setTheme] = useState(() => localStorage.getItem('ntega_theme') || 'dark');
        const [query, setQuery] = useState('');
        const [filter, setFilter] = useState('all');
        const [view, setView] = useState('table');
        const [results, setResults] = useState([]);
        const [stats, setStats] = useState({ total_students: 919396, passed_students: 650909, pass_rate: 70.8, max_degree: 320 });
        const [loading, setLoading] = useState(false);
        const [selectedStudent, setSelectedStudent] = useState(null);
        const [toast, setToast] = useState('');

        const cacheRef = useRef(new Map());

        useEffect(() => {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('ntega_theme', theme);
        }, [theme]);

        useEffect(() => {
            fetchStats();
            preloadCommonData();

            // Direct Link Seating / Query Handler
            const params = new URLSearchParams(window.location.search);
            const seatingParam = params.get('seating') || params.get('q');
            if (seatingParam) {
                setQuery(seatingParam);
            }
        }, []);

        const fetchStats = async () => {
            try {
                const res = await fetch('./data/stats.json');
                if (res.ok) {
                    const data = await res.json();
                    setStats(data);
                }
            } catch (e) {}
        };

        const preloadCommonData = async () => {
            try {
                const res = await fetch('./data/seating/2001.json');
                if (res.ok) {
                    const data = await res.json();
                    cacheRef.current.set('preload_2001', data);
                }
            } catch (e) {}
        };

        const toggleTheme = () => {
            setTheme(prev => prev === 'dark' ? 'light' : 'dark');
        };

        const showToast = (msg) => {
            setToast(msg);
            setTimeout(() => setToast(''), 2500);
        };

        useEffect(() => {
            const timer = setTimeout(() => {
                performSearch(query, filter);
            }, 120);
            return () => clearTimeout(timer);
        }, [query, filter]);

        const performSearch = async (q, flt) => {
            const trimmed = q.trim();
            if (!trimmed && flt === 'all') {
                setResults([]);
                return;
            }

            const cacheKey = `${trimmed}_${flt}`;
            if (cacheRef.current.has(cacheKey)) {
                const cached = cacheRef.current.get(cacheKey);
                setResults(cached.results);
                checkAutoOpenStudent(cached.results, trimmed);
                return;
            }

            setLoading(true);

            try {
                let items = [];
                if (!trimmed) {
                    if (cacheRef.current.has('preload_2001')) {
                        items = cacheRef.current.get('preload_2001');
                    } else {
                        const res = await fetch('./data/seating/2001.json');
                        if (res.ok) items = await res.json();
                    }
                } else if (/^\d+$/.test(trimmed)) {
                    const prefix = trimmed.slice(0, 4);
                    const res = await fetch(`./data/seating/${prefix}.json`);
                    if (res.ok) {
                        const data = await res.json();
                        items = data.filter(s => String(s.seating_no).startsWith(trimmed));
                    }
                } else {
                    const rawPrefix = trimmed.slice(0, 2);
                    const asciiKey = Array.from(rawPrefix).map(c => c.charCodeAt(0)).join('_');
                    const res = await fetch(`./data/names/${asciiKey}.json`);
                    if (res.ok) {
                        const data = await res.json();
                        const words = trimmed.split(/\s+/).map(normalizeArabic).filter(w => w);
                        items = data.filter(s => {
                            const normName = normalizeArabic(s.arabic_name);
                            return words.every(w => normName.includes(w));
                        });
                    }
                }

                if (flt === 'pass') items = items.filter(s => s.student_case_desc.includes('ناجح'));
                else if (flt === 'second') items = items.filter(s => s.student_case_desc.includes('دور ثان'));
                else if (flt === 'top') items = items.filter(s => (s.percentage || (s.total_degree / stats.max_degree * 100)) >= 90);

                const finalResults = items.slice(0, 100);
                cacheRef.current.set(cacheKey, { results: finalResults });
                setResults(finalResults);
                checkAutoOpenStudent(finalResults, trimmed);

            } catch (e) {
                setResults([]);
            } finally {
                setLoading(false);
            }
        };

        const checkAutoOpenStudent = (resList, searchStr) => {
            const params = new URLSearchParams(window.location.search);
            const seatingParam = params.get('seating') || params.get('q');
            if (seatingParam && String(seatingParam) === String(searchStr)) {
                const match = resList.find(s => String(s.seating_no) === String(seatingParam));
                if (match) {
                    setSelectedStudent(match);
                }
            }
        };

        const handleQuickSearch = (val) => {
            setQuery(val);
        };

        const exportCSV = () => {
            if (results.length === 0) {
                showToast('لا توجد نتائج للتصدير');
                return;
            }
            let csv = "\uFEFFرقم الجلوس,اسم الطالب,المجموع الكلي,النسبة المئوية,حالة الطالب\n";
            results.forEach(r => {
                const pct = r.percentage || ((r.total_degree / stats.max_degree) * 100).toFixed(2);
                csv += `"${r.seating_no}","${r.arabic_name}","${r.total_degree}","${pct}%","${r.student_case_desc}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `نتائج_الثانوية_العامة_2026.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('تم تصدير النتائج إلى CSV بنجاح!');
        };

        return (
            <div class="app-container">
                <Header theme={theme} toggleTheme={toggleTheme} />
                <KPIGrid stats={stats} />

                <main class="main-content">
                    <section class="search-section">
                        <div class="search-box-wrapper">
                            <div class="search-input-container">
                                <svg class="search-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <input
                                    type="text"
                                    id="searchInput"
                                    value={query}
                                    onChange={(e) => setQuery(e.target.value)}
                                    placeholder="اكتب اسم الطالب أو رقم الجلوس للاستعلام الفوري..."
                                    autoComplete="off"
                                    autoFocus
                                />
                                {query && (
                                    <button class="clear-btn" onClick={() => setQuery('')}>
                                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                                            <line x1="18" y1="6" x2="6" y2="18"></line>
                                            <line x1="6" y1="6" x2="18" y2="18"></line>
                                        </svg>
                                    </button>
                                )}
                            </div>

                            {/* Easy Quick Search Chips */}
                            <div class="quick-search-tags">
                                <span class="quick-title">أمثلة سريعة:</span>
                                <button class="quick-tag" onClick={() => handleQuickSearch('أحمد')}>أحمد</button>
                                <button class="quick-tag" onClick={() => handleQuickSearch('محمد')}>محمد</button>
                                <button class="quick-tag" onClick={() => handleQuickSearch('محمود')}>محمود</button>
                                <button class="quick-tag" onClick={() => handleQuickSearch('280145')}>280145</button>
                            </div>
                        </div>

                        <div class="controls-toolbar">
                            <div class="filter-chips">
                                {['all', 'pass', 'top', 'second'].map(flt => (
                                    <button
                                        key={flt}
                                        class={`chip ${filter === flt ? 'active' : ''}`}
                                        onClick={() => setFilter(flt)}
                                    >
                                        {flt === 'all' && 'جميع الطلاب'}
                                        {flt === 'pass' && 'الناجحون'}
                                        {flt === 'top' && 'الأوائل والمتفوقون'}
                                        {flt === 'second' && 'الدور الثاني'}
                                    </button>
                                ))}
                            </div>

                            <div class="view-and-actions">
                                <div class="view-switcher">
                                    <button class={`view-btn ${view === 'table' ? 'active' : ''}`} onClick={() => setView('table')} title="عرض جدول">
                                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                                            <line x1="8" y1="6" x2="21" y2="6"></line>
                                            <line x1="8" y1="12" x2="21" y2="12"></line>
                                            <line x1="8" y1="18" x2="21" y2="18"></line>
                                        </svg>
                                    </button>
                                    <button class={`view-btn ${view === 'card' ? 'active' : ''}`} onClick={() => setView('card')} title="عرض كروت">
                                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="3" y="3" width="7" height="7"></rect>
                                            <rect x="14" y="3" width="7" height="7"></rect>
                                            <rect x="14" y="14" width="7" height="7"></rect>
                                            <rect x="3" y="14" width="7" height="7"></rect>
                                        </svg>
                                    </button>
                                </div>
                                <button class="export-btn" onClick={exportCSV}>
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" style={{ marginLeft: '6px', verticalAlign: 'middle' }}>
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                        <polyline points="7 10 12 15 17 10"></polyline>
                                        <line x1="12" y1="15" x2="12" y2="3"></line>
                                    </svg>
                                    تصدير النتائج
                                </button>
                            </div>
                        </div>

                        <div class="stats-bar">
                            <div class="stat-item">
                                <span class="stat-label">عدد النتائج المعروضة:</span>
                                <span class="stat-value">{results.length} طالب</span>
                            </div>
                            <div class="stat-item">
                                <span class="status-indicator"></span>
                                <span class="stat-label">قاعدة البيانات محدثة رسمياً</span>
                            </div>
                        </div>
                    </section>

                    <section class="results-section">
                        {loading && (
                            <div class="loading-state">
                                <div class="spinner"></div>
                                <p>جاري استخراج نتائج الطلاب والتأكد من البيانات...</p>
                            </div>
                        )}

                        {!loading && results.length === 0 && (query || filter !== 'all') && (
                            <div class="empty-state">
                                <h3>لا توجد نتائج مطابقة</h3>
                                <p>يرجى التأكد من كتابة الاسم أو رقم الجلوس بشكل صحيح.</p>
                            </div>
                        )}

                        {!loading && results.length === 0 && !query && filter === 'all' && (
                            <div class="initial-state">
                                <h3>البوابة الرسمية لنتائج الثانوية العامة</h3>
                                <p>ادخل الاسم أو رقم الجلوس في خانة البحث أعلاه للحصول على النتيجة والنسبة المئوية فوراً.</p>
                            </div>
                        )}

                        {!loading && results.length > 0 && view === 'table' && (
                            <ResultsTable results={results} maxDegree={stats.max_degree} onSelect={setSelectedStudent} />
                        )}

                        {!loading && results.length > 0 && view === 'card' && (
                            <ResultsGrid results={results} maxDegree={stats.max_degree} onSelect={setSelectedStudent} />
                        )}
                    </section>
                </main>

                {selectedStudent && (
                    <CertificateModal student={selectedStudent} maxDegree={stats.max_degree} onClose={() => setSelectedStudent(null)} showToast={showToast} />
                )}

                {toast && <div class="toast"><span>{toast}</span></div>}

                <footer class="main-footer">
                    <div class="footer-content">
                        <p class="copyright">جميع الحقوق محفوظة &copy; 2026 DevMeDoAnDrOiD</p>
                        <div class="footer-signature">DevMeDoAnDrOiD</div>
                    </div>
                </footer>
            </div>
        );
    }

    function Header({ theme, toggleTheme }) {
        return (
            <header class="main-header">
                <div class="brand-container">
                    <div class="brand-logo">
                        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <h1>نتائج الثانوية العامة <span class="badge-year">2026</span></h1>
                        <p class="subtitle">الموقع الرسمي المعتمد لاستعلام نتائج الطلاب وحساب النسب المئوية</p>
                    </div>
                </div>

                <div class="header-actions">
                    <div class="dev-badge">
                        <span class="pulse-dot"></span>
                        <span>DevMeDoAnDrOiD</span>
                    </div>

                    <button class="theme-toggle" onClick={toggleTheme} aria-label="تبديل المظهر">
                        {theme === 'dark' ? (
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                        ) : (
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                        )}
                    </button>
                </div>
            </header>
        );
    }

    function KPIGrid({ stats }) {
        return (
            <section class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-icon blue">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <div>
                        <span class="kpi-title">إجمالي الطلاب المتقدمين</span>
                        <span class="kpi-number">{(stats.total_students || 919396).toLocaleString('ar-EG')}</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon green">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <div>
                        <span class="kpi-title">الطلاب الناجحون</span>
                        <span class="kpi-number">{(stats.passed_students || 650909).toLocaleString('ar-EG')} ({stats.pass_rate}%)</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon gold">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                            <path d="M4 22h16"></path>
                            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                            <path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path>
                        </svg>
                    </div>
                    <div>
                        <span class="kpi-title">أعلى درجة بالدفعة</span>
                        <span class="kpi-number">{stats.max_degree} درجة</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon purple">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>
                    <div>
                        <span class="kpi-title">العام الدراسي الحالي</span>
                        <span class="kpi-number">2025 / 2026</span>
                    </div>
                </div>
            </section>
        );
    }

    function ResultsTable({ results, maxDegree, onSelect }) {
        return (
            <div class="table-container">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>رقم الجلوس</th>
                            <th>اسم الطالب</th>
                            <th>المجموع الكلي</th>
                            <th>النسبة المئوية</th>
                            <th>حالة الطالب</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody>
                        {results.map((row, idx) => {
                            const pct = row.percentage || ((row.total_degree / maxDegree) * 100).toFixed(2);
                            const isPass = row.student_case_desc.includes('ناجح');
                            const isSecond = row.student_case_desc.includes('دور ثان');
                            const caseClass = isPass ? 'case-pass' : (isSecond ? 'case-warning' : 'case-fail');

                            return (
                                <tr key={row.seating_no} style={{ animationDelay: `${Math.min(idx * 0.03, 0.4)}s` }} onClick={() => onSelect(row)}>
                                    <td><span class="seating-badge">{row.seating_no}</span></td>
                                    <td><strong>{row.arabic_name}</strong></td>
                                    <td><span class="degree-badge">{row.total_degree}</span></td>
                                    <td><span class="percent-badge">{pct}%</span></td>
                                    <td><span class={`case-badge ${caseClass}`}>{row.student_case_desc}</span></td>
                                    <td>
                                        <button class="action-btn">
                                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style={{ marginLeft: '4px' }}>
                                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                                <polyline points="14 2 14 8 20 8"></polyline>
                                            </svg>
                                            عرض الشهادة
                                        </button>
                                    </td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
            </div>
        );
    }

    function ResultsGrid({ results, maxDegree, onSelect }) {
        return (
            <div class="cards-grid">
                {results.map((row, idx) => {
                    const pct = row.percentage || ((row.total_degree / maxDegree) * 100).toFixed(2);
                    const isPass = row.student_case_desc.includes('ناجح');
                    const isSecond = row.student_case_desc.includes('دور ثان');
                    const caseClass = isPass ? 'case-pass' : (isSecond ? 'case-warning' : 'case-fail');

                    return (
                        <div key={row.seating_no} class="student-card" style={{ animationDelay: `${Math.min(idx * 0.04, 0.5)}s` }} onClick={() => onSelect(row)}>
                            <div class="card-header-row">
                                <span class="seating-badge">{row.seating_no}</span>
                                <span class={`case-badge ${caseClass}`}>{row.student_case_desc}</span>
                            </div>
                            <div class="student-name">{row.arabic_name}</div>
                            <div class="card-stats-row">
                                <span class="degree-badge">المجموع: {row.total_degree}</span>
                                <span class="percent-badge">{pct}%</span>
                            </div>
                            <div class="card-footer-row">
                                <button class="action-btn">عرض الشهادة الموثقة</button>
                            </div>
                        </div>
                    );
                })}
            </div>
        );
    }

    function CertificateModal({ student, maxDegree, onClose, showToast }) {
        const pct = student.percentage || ((student.total_degree / maxDegree) * 100).toFixed(2);
        const isPass = student.student_case_desc.includes('ناجح');
        const isSecond = student.student_case_desc.includes('دور ثان');
        const caseClass = isPass ? 'case-pass' : (isSecond ? 'case-warning' : 'case-fail');

        const copyText = () => {
            const text = `اسم الطالب: ${student.arabic_name}\nرقم الجلوس: ${student.seating_no}\nالمجموع: ${student.total_degree} / ${maxDegree}\nالنسبة المئوية: ${pct}%\nالحالة: ${student.student_case_desc}`;
            navigator.clipboard.writeText(text).then(() => showToast('تم نسخ بيانات الشهادة بنجاح!'));
        };

        const copyDirectLink = () => {
            const shareUrl = `${window.location.origin}${window.location.pathname}?seating=${student.seating_no}`;
            navigator.clipboard.writeText(shareUrl).then(() => showToast('تم نسخ رابط النتيجة المباشر بنجاح!'));
        };

        return (
            <div class="modal-overlay" onClick={onClose}>
                <div class="modal-card" onClick={e => e.stopPropagation()}>
                    <button class="modal-close-btn" onClick={onClose}>&times;</button>
                    <div class="certificate-header">
                        <div class="cert-watermark">DevMeDoAnDrOiD</div>
                        <h2>شهادة نتيجة الثانوية العامة 2026</h2>
                        <p class="cert-sub">وزارة التربية والتعليم والتعليم الفني - وثيقة رسمية موثقة</p>
                    </div>
                    <div class="certificate-body">
                        <div class="cert-field">
                            <span class="cert-label">اسم الطالب:</span>
                            <span class="cert-value">{student.arabic_name}</span>
                        </div>
                        <div class="cert-row">
                            <div class="cert-field">
                                <span class="cert-label">رقم الجلوس:</span>
                                <span class="cert-value highlight">{student.seating_no}</span>
                            </div>
                            <div class="cert-field">
                                <span class="cert-label">المجموع الكلي:</span>
                                <span class="cert-value score">{student.total_degree} / {maxDegree}</span>
                            </div>
                        </div>
                        <div class="cert-row">
                            <div class="cert-field">
                                <span class="cert-label">النسبة المئوية:</span>
                                <span class="cert-value percent-badge">{pct}%</span>
                            </div>
                            <div class="cert-field">
                                <span class="cert-label">حالة الطالب:</span>
                                <span class={`cert-value status-badge case-badge ${caseClass}`}>{student.student_case_desc}</span>
                            </div>
                        </div>
                        <div class="progress-bar-wrapper">
                            <div class="progress-bar-label">
                                <span>المعدل المئوي للإنجاز:</span>
                                <span>{pct}%</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill" style={{ width: `${Math.min(pct, 100)}%` }}></div>
                            </div>
                        </div>
                    </div>
                    <div class="certificate-footer">
                        <button class="cert-btn primary" onClick={() => window.print()}>
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style={{ marginLeft: '8px' }}>
                                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                                <rect x="6" y="14" width="12" height="8"></rect>
                            </svg>
                            طباعة الشهادة
                        </button>
                        <button class="cert-btn secondary" onClick={copyDirectLink}>
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style={{ marginLeft: '6px' }}>
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                            </svg>
                            نسخ رابط النتيجة
                        </button>
                        <button class="cert-btn secondary" onClick={copyText}>نسخ النص</button>
                    </div>
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
