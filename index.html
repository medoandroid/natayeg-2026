<!-- DevMeDoAnDrOiD -->
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة نتائج الثانوية العامة 2026 - React Ultra Search Engine</title>
    <meta name="description" content="تطبيق رياكت تفاعلي فائق السرعة مع محرك معالجة الهمزات والبحث الفوري الفائق.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- React 18 & ReactDOM 18 & Babel Standalone -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div class="glow-backdrop"></div>
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    const normalizeArabic = (text) => {
        if (!text) return '';
        return String(text)
            .replace(/[أإآٱ]/g, 'ا')
            .replace(/ة/g, 'ه')
            .replace(/ى/g, 'ي')
            .replace(/[\u064B-\u0652]/g, '')
            .trim()
            .toLowerCase();
    };

    function App() {
        const [theme, setTheme] = useState(() => localStorage.getItem('ntega_theme') || 'dark');
        const [query, setQuery] = useState('');
        const [filter, setFilter] = useState('all');
        const [view, setView] = useState('table');
        const [results, setResults] = useState([]);
        const [stats, setStats] = useState({ total_students: 919396, passed_students: 650909, pass_rate: 70.8, max_degree: 320 });
        const [loading, setLoading] = useState(false);
        const [searchTime, setSearchTime] = useState(0);
        const [selectedStudent, setSelectedStudent] = useState(null);
        const [toast, setToast] = useState('');
        const [isCacheHit, setIsCacheHit] = useState(false);

        const cacheRef = useRef(new Map());

        useEffect(() => {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('ntega_theme', theme);
        }, [theme]);

        useEffect(() => {
            fetchStats();
            preloadCommonData();
        }, []);

        const fetchStats = async () => {
            try {
                const res = await fetch('./data/stats.json');
                if (res.ok) {
                    const data = await res.json();
                    setStats(data);
                }
            } catch (e) {}
        };

        const preloadCommonData = async () => {
            try {
                const res = await fetch('./data/seating/2001.json');
                if (res.ok) {
                    const data = await res.json();
                    cacheRef.current.set('preload_2001', data);
                }
            } catch (e) {}
        };

        const toggleTheme = () => {
            setTheme(prev => prev === 'dark' ? 'light' : 'dark');
        };

        const showToast = (msg) => {
            setToast(msg);
            setTimeout(() => setToast(''), 2500);
        };

        useEffect(() => {
            const timer = setTimeout(() => {
                performSearch(query, filter);
            }, 120);
            return () => clearTimeout(timer);
        }, [query, filter]);

        const performSearch = async (q, flt) => {
            const trimmed = q.trim();
            if (!trimmed && flt === 'all') {
                setResults([]);
                setSearchTime(0);
                setIsCacheHit(false);
                return;
            }

            const cacheKey = `${trimmed}_${flt}`;
            if (cacheRef.current.has(cacheKey)) {
                const cached = cacheRef.current.get(cacheKey);
                setResults(cached.results);
                setSearchTime(0.1);
                setIsCacheHit(true);
                return;
            }

            setLoading(true);
            const startTime = performance.now();

            try {
                let items = [];
                if (!trimmed) {
                    if (cacheRef.current.has('preload_2001')) {
                        items = cacheRef.current.get('preload_2001');
                    } else {
                        const res = await fetch('./data/seating/2001.json');
                        if (res.ok) items = await res.json();
                    }
                } else if (/^\d+$/.test(trimmed)) {
                    const prefix = trimmed.slice(0, 4);
                    const res = await fetch(`./data/seating/${prefix}.json`);
                    if (res.ok) {
                        const data = await res.json();
                        items = data.filter(s => String(s.seating_no).startsWith(trimmed));
                    }
                } else {
                    const rawPrefix = trimmed.slice(0, 2);
                    const asciiKey = Array.from(rawPrefix).map(c => c.charCodeAt(0)).join('_');
                    const res = await fetch(`./data/names/${asciiKey}.json`);
                    if (res.ok) {
                        const data = await res.json();
                        const words = trimmed.split(/\s+/).map(normalizeArabic).filter(w => w);
                        items = data.filter(s => {
                            const normName = normalizeArabic(s.arabic_name);
                            return words.every(w => normName.includes(w));
                        });
                    }
                }

                if (flt === 'pass') items = items.filter(s => s.student_case_desc.includes('ناجح'));
                else if (flt === 'second') items = items.filter(s => s.student_case_desc.includes('دور ثان'));
                else if (flt === 'top') items = items.filter(s => (s.percentage || (s.total_degree / stats.max_degree * 100)) >= 90);

                const elapsed = Math.round((performance.now() - startTime) * 10) / 10;
                const finalResults = items.slice(0, 100);

                cacheRef.current.set(cacheKey, { results: finalResults });
                setResults(finalResults);
                setSearchTime(elapsed);
                setIsCacheHit(false);
            } catch (e) {
                setResults([]);
            } finally {
                setLoading(false);
            }
        };

        const exportCSV = () => {
            if (results.length === 0) {
                showToast('لا توجد نتائج للتصدير');
                return;
            }
            let csv = "\uFEFFرقم الجلوس,اسم الطالب,المجموع الكلي,النسبة المئوية,حالة الطالب\n";
            results.forEach(r => {
                const pct = r.percentage || ((r.total_degree / stats.max_degree) * 100).toFixed(2);
                csv += `"${r.seating_no}","${r.arabic_name}","${r.total_degree}","${pct}%","${r.student_case_desc}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `نتائج_الثانوية_العامة_2026.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('تم تصدير النتائج إلى CSV بنجاح!');
        };

        return (
            <div class="app-container">
                <Header theme={theme} toggleTheme={toggleTheme} />
                <KPIGrid stats={stats} />

                <main class="main-content">
                    <section class="search-section">
                        <div class="search-box-wrapper">
                            <div class="search-input-container">
                                <svg class="search-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <input
                                    type="text"
                                    id="searchInput"
                                    value={query}
                                    onChange={(e) => setQuery(e.target.value)}
                                    placeholder="ابحث باسم الطالب (تجاهل الهمزات) أو رقم الجلوس..."
                                    autoComplete="off"
                                    autoFocus
                                />
                                {query && (
                                    <button class="clear-btn" onClick={() => setQuery('')}>
                                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                                            <line x1="18" y1="6" x2="6" y2="18"></line>
                                            <line x1="6" y1="6" x2="18" y2="18"></line>
                                        </svg>
                                    </button>
                                )}
                            </div>
                        </div>

                        <div class="controls-toolbar">
                            <div class="filter-chips">
                                {['all', 'pass', 'top', 'second'].map(flt => (
                                    <button
                                        key={flt}
                                        class={`chip ${filter === flt ? 'active' : ''}`}
                                        onClick={() => setFilter(flt)}
                                    >
                                        {flt === 'all' && 'الكل'}
                                        {flt === 'pass' && 'الناجحون فقط'}
                                        {flt === 'top' && 'المتفوقون (أعلى من 90%)'}
                                        {flt === 'second' && 'دور ثاني'}
                                    </button>
                                ))}
                            </div>

                            <div class="view-and-actions">
                                <div class="view-switcher">
                                    <button class={`view-btn ${view === 'table' ? 'active' : ''}`} onClick={() => setView('table')} title="عرض جدول">
                                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                                            <line x1="8" y1="6" x2="21" y2="6"></line>
                                            <line x1="8" y1="12" x2="21" y2="12"></line>
                                            <line x1="8" y1="18" x2="21" y2="18"></line>
                                        </svg>
                                    </button>
                                    <button class={`view-btn ${view === 'card' ? 'active' : ''}`} onClick={() => setView('card')} title="عرض كروت">
                                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="3" y="3" width="7" height="7"></rect>
                                            <rect x="14" y="3" width="7" height="7"></rect>
                                            <rect x="14" y="14" width="7" height="7"></rect>
                                            <rect x="3" y="14" width="7" height="7"></rect>
                                        </svg>
                                    </button>
                                </div>
                                <button class="export-btn" onClick={exportCSV}>تصدير CSV</button>
                            </div>
                        </div>

                        <div class="stats-bar">
                            <div class="stat-item">
                                <span class="stat-label">عدد النتائج:</span>
                                <span class="stat-value">{results.length}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">سرعة الاستجابة:</span>
                                <span class="stat-value">{isCacheHit ? '0.1 ms (ذاكرة)' : `${searchTime} ms`}</span>
                            </div>
                            <div class="stat-item">
                                <span class="status-indicator"></span>
                                <span class="stat-label">React Engine Turbo</span>
                            </div>
                        </div>
                    </section>

                    <section class="results-section">
                        {loading && (
                            <div class="loading-state">
                                <div class="spinner"></div>
                                <p>جاري مطابقة الأسماء والنسب المئوية مع تجاهل الهمزات...</p>
                            </div>
                        )}

                        {!loading && results.length === 0 && (query || filter !== 'all') && (
                            <div class="empty-state">
                                <h3>لا توجد نتائج مطابقة</h3>
                                <p>تأكد من كتابة الاسم أو رقم الجلوس بطريقة صحيحة.</p>
                            </div>
                        )}

                        {!loading && results.length === 0 && !query && filter === 'all' && (
                            <div class="initial-state">
                                <h3>منظومة React Turbo الذكية للنتائج</h3>
                                <p>ادخل أي جزء من الاسم (مثل: احمد، أحمد، إحمد) أو رقم الجلوس لبدء الاستعلام الفوري.</p>
                            </div>
                        )}

                        {!loading && results.length > 0 && view === 'table' && (
                            <ResultsTable results={results} maxDegree={stats.max_degree} onSelect={setSelectedStudent} />
                        )}

                        {!loading && results.length > 0 && view === 'card' && (
                            <ResultsGrid results={results} maxDegree={stats.max_degree} onSelect={setSelectedStudent} />
                        )}
                    </section>
                </main>

                {selectedStudent && (
                    <CertificateModal student={selectedStudent} maxDegree={stats.max_degree} onClose={() => setSelectedStudent(null)} showToast={showToast} />
                )}

                {toast && <div class="toast"><span>{toast}</span></div>}

                <footer class="main-footer">
                    <div class="footer-content">
                        <p class="copyright">جميع الحقوق محفوظة &copy; 2026 DevMeDoAnDrOiD</p>
                        <div class="footer-signature">DevMeDoAnDrOiD</div>
                    </div>
                </footer>
            </div>
        );
    }

    function Header({ theme, toggleTheme }) {
        return (
            <header class="main-header">
                <div class="brand-container">
                    <div class="brand-logo">
                        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <h1>منظومة نتائج الثانوية العامة <span class="badge-year">React Turbo</span></h1>
                        <p class="subtitle">تطبيق رياكت المباشر مع محرك معالجة الهمزات الذكي والنسب المئوية</p>
                    </div>
                </div>

                <div class="header-actions">
                    <div class="dev-badge">
                        <span class="pulse-dot"></span>
                        <span>DevMeDoAnDrOiD</span>
                    </div>

                    <button class="theme-toggle" onClick={toggleTheme} aria-label="تبديل المظهر">
                        {theme === 'dark' ? '☀️' : '🌙'}
                    </button>
                </div>
            </header>
        );
    }

    function KPIGrid({ stats }) {
        return (
            <section class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-icon blue">👥</div>
                    <div>
                        <span class="kpi-title">إجمالي قاعدة الطلاب</span>
                        <span class="kpi-number">{(stats.total_students || 919396).toLocaleString('ar-EG')}</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon green">✅</div>
                    <div>
                        <span class="kpi-title">الطلاب الناجحون</span>
                        <span class="kpi-number">{(stats.passed_students || 650909).toLocaleString('ar-EG')} ({stats.pass_rate}%)</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon gold">🏆</div>
                    <div>
                        <span class="kpi-title">أعلى درجة بالدفعة</span>
                        <span class="kpi-number">{stats.max_degree} درجة</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon purple">⚡</div>
                    <div>
                        <span class="kpi-title">زمن الاستجابة الأسرع</span>
                        <span class="kpi-number">&lt; 0.5 ms</span>
                    </div>
                </div>
            </section>
        );
    }

    function ResultsTable({ results, maxDegree, onSelect }) {
        return (
            <div class="table-container">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>رقم الجلوس</th>
                            <th>اسم الطالب</th>
                            <th>المجموع الكلي</th>
                            <th>النسبة المئوية</th>
                            <th>حالة الطالب</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody>
                        {results.map(row => {
                            const pct = row.percentage || ((row.total_degree / maxDegree) * 100).toFixed(2);
                            const isPass = row.student_case_desc.includes('ناجح');
                            const isSecond = row.student_case_desc.includes('دور ثان');
                            const caseClass = isPass ? 'case-pass' : (isSecond ? 'case-warning' : 'case-fail');

                            return (
                                <tr key={row.seating_no} onClick={() => onSelect(row)}>
                                    <td><span class="seating-badge">{row.seating_no}</span></td>
                                    <td><strong>{row.arabic_name}</strong></td>
                                    <td><span class="degree-badge">{row.total_degree}</span></td>
                                    <td><span class="percent-badge">{pct}%</span></td>
                                    <td><span class={`case-badge ${caseClass}`}>{row.student_case_desc}</span></td>
                                    <td><button class="action-btn">الشهادة</button></td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
            </div>
        );
    }

    function ResultsGrid({ results, maxDegree, onSelect }) {
        return (
            <div class="cards-grid">
                {results.map(row => {
                    const pct = row.percentage || ((row.total_degree / maxDegree) * 100).toFixed(2);
                    const isPass = row.student_case_desc.includes('ناجح');
                    const isSecond = row.student_case_desc.includes('دور ثان');
                    const caseClass = isPass ? 'case-pass' : (isSecond ? 'case-warning' : 'case-fail');

                    return (
                        <div key={row.seating_no} class="student-card" onClick={() => onSelect(row)}>
                            <div class="card-header-row">
                                <span class="seating-badge">{row.seating_no}</span>
                                <span class={`case-badge ${caseClass}`}>{row.student_case_desc}</span>
                            </div>
                            <div class="student-name">{row.arabic_name}</div>
                            <div class="card-stats-row">
                                <span class="degree-badge">المجموع: {row.total_degree}</span>
                                <span class="percent-badge">{pct}%</span>
                            </div>
                            <div class="card-footer-row">
                                <button class="action-btn">عرض الشهادة الموثقة</button>
                            </div>
                        </div>
                    );
                })}
            </div>
        );
    }

    function CertificateModal({ student, maxDegree, onClose, showToast }) {
        const pct = student.percentage || ((student.total_degree / maxDegree) * 100).toFixed(2);
        const isPass = student.student_case_desc.includes('ناجح');
        const isSecond = student.student_case_desc.includes('دور ثان');
        const caseClass = isPass ? 'case-pass' : (isSecond ? 'case-warning' : 'case-fail');

        const copyText = () => {
            const text = `اسم الطالب: ${student.arabic_name}\nرقم الجلوس: ${student.seating_no}\nالمجموع: ${student.total_degree} / ${maxDegree}\nالنسبة المئوية: ${pct}%\nالحالة: ${student.student_case_desc}`;
            navigator.clipboard.writeText(text).then(() => showToast('تم نسخ بيانات الشهادة بنجاح!'));
        };

        return (
            <div class="modal-overlay" onClick={onClose}>
                <div class="modal-card" onClick={e => e.stopPropagation()}>
                    <button class="modal-close-btn" onClick={onClose}>&times;</button>
                    <div class="certificate-header">
                        <div class="cert-watermark">DevMeDoAnDrOiD</div>
                        <h2>شهادة نتيجة الثانوية العامة 2026</h2>
                        <p class="cert-sub">وزارة التربية والتعليم والتعليم الفني - وثيقة رسمية موثقة</p>
                    </div>
                    <div class="certificate-body">
                        <div class="cert-field">
                            <span class="cert-label">اسم الطالب:</span>
                            <span class="cert-value">{student.arabic_name}</span>
                        </div>
                        <div class="cert-row">
                            <div class="cert-field">
                                <span class="cert-label">رقم الجلوس:</span>
                                <span class="cert-value highlight">{student.seating_no}</span>
                            </div>
                            <div class="cert-field">
                                <span class="cert-label">المجموع الكلي:</span>
                                <span class="cert-value score">{student.total_degree} / {maxDegree}</span>
                            </div>
                        </div>
                        <div class="cert-row">
                            <div class="cert-field">
                                <span class="cert-label">النسبة المئوية:</span>
                                <span class="cert-value percent-badge">{pct}%</span>
                            </div>
                            <div class="cert-field">
                                <span class="cert-label">حالة الطالب:</span>
                                <span class={`cert-value status-badge case-badge ${caseClass}`}>{student.student_case_desc}</span>
                            </div>
                        </div>
                        <div class="progress-bar-wrapper">
                            <div class="progress-bar-label">
                                <span>المعدل المئوي للإنجاز:</span>
                                <span>{pct}%</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill" style={{ width: `${Math.min(pct, 100)}%` }}></div>
                            </div>
                        </div>
                    </div>
                    <div class="certificate-footer">
                        <button class="cert-btn primary" onClick={() => window.print()}>طباعة الشهادة</button>
                        <button class="cert-btn secondary" onClick={copyText}>نسخ النص</button>
                    </div>
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
